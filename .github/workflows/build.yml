name: build

# Runs on every push except to `feat/*`, `fix/*` and `chore/*` branches (which are checked through
# their pull requests), on every pull request, and as the first stage of the release workflow.
on:
  push:
    branches-ignore:
      - '**/feat/*'
      - '**/fix/*'
      - '**/chore/*'
  pull_request:
    branches:
      - '*'
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The toolchain of the lints: pinned, so that a new Rust release cannot break the build on its own.
  # It is raised by hand, together with the fixes for any new lints.
  RUST_LINT_VERSION: "1.99.0"
  # The minimum supported Rust version: `rust-version` in Cargo.toml and `msrv` in clippy.toml.
  RUST_MIN_VERSION: "1.95.0"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The crate's tests start an interpreter in-process.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_LINT_VERSION }}
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: "-D warnings"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_MIN_VERSION }}
      - run: cargo +${{ env.RUST_MIN_VERSION }} test --workspace

  # Builds the wheel the way a release does (release profile; stable ABI, except on a free-threaded
  # interpreter) and runs the Python test suite against it, on the oldest and the newest supported
  # Python version and on the free-threaded build of the newest one.
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.15", "3.15t"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and install both packages
        shell: bash
        run: |
          python -m pip install maturin pytest ruff
          # `--interpreter python`: on a free-threaded interpreter, the stable ABI does not apply and
          # the wheel must be built for that interpreter.
          maturin build --release --interpreter python --manifest-path biodivine-py-sys/Cargo.toml --out dist
          # `--no-index`: the wheel that was just built, never a release of the same version.
          python -m pip install --no-index --find-links dist biodivine-sys
          python -m pip install ./biodivine
      - run: ruff check biodivine scripts
      - run: python -m pytest biodivine

  # Builds the conda packages, which also runs the test suite against them; the release builds them
  # on every platform.
  conda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          rattler-build-version: v0.76.1
          setup-only: true
      - run: rattler-build build --recipe conda/recipe.yaml -c conda-forge --output-dir conda-dist

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - run: make venv develop docs
