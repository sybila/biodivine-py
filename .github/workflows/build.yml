name: build

on:
  push:
    branches-ignore:
      - '**/feat/*'
      - '**/fix/*'
      - '**/chore/*'
  pull_request:
    branches:
      - '*'

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace

  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install both packages
        shell: bash
        run: |
          python -m pip install maturin pytest ruff
          maturin build --release --manifest-path biodivine-py-sys/Cargo.toml --out dist
          python -m pip install --find-links dist biodivine-sys
          python -m pip install ./biodivine
      - run: ruff check biodivine
      - run: python -m pytest biodivine

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m venv .venv
          .venv/bin/pip install maturin pytest ruff -r biodivine/docs/requirements.txt
          make develop docs
