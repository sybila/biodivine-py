# Releases both Python distributions when a version tag is pushed: publishes them to PyPI and (for
# a stable release) to the `daemontus` channel on anaconda.org, deploys the API reference to
# https://biodivine.fi.muni.cz/docs/biodivine-py/<tag>/, and creates a draft GitHub release with
# generated release notes. `biodivine` pins `biodivine-sys` exactly, so the two are always released
# together, with the same version.
#
# The wheels of `biodivine-sys` are built against the stable ABI (the `abi3` feature), so one wheel
# per platform covers every supported CPython version. Free-threaded CPython cannot use the stable
# ABI and gets one wheel per platform for each of its two newest versions. Other platforms and
# interpreters build the extension from the source distribution, which needs a Rust toolchain.
#
# Secrets and settings:
# * PyPI trusted publishing: both PyPI projects list this repository, this workflow and the `pypi`
#   environment as a trusted publisher.
# * `TS_OAUTH_CLIENT_ID`, `TS_OAUTH_SECRET`: a Tailscale OAuth client that can join the network of
#   the documentation server.
# * `OPENROUTER_API_KEY`: the key of the release-notes model (see `.releasenotes.yml`).
# * `ANACONDA_TOKEN`: an anaconda.org API token that can upload to the `daemontus` channel.
name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  # The free-threaded interpreters that get their own wheels (one wheel per version, because
  # free-threaded CPython has no stable ABI yet): the two newest versions.
  FREE_THREADED_OLDER: "3.14t"
  FREE_THREADED_NEWEST: "3.15t"
  # The anaconda.org channel of the conda packages.
  ANACONDA_OWNER: daemontus

jobs:
  # The tag must name the version that is being released.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the version $version in Cargo.toml."
            exit 1
          fi

  # Every check of a regular build.
  build:
    uses: ./.github/workflows/build.yml

  # Every wheel is built on a runner of its own architecture, so that maturin can always find the
  # interpreter it builds for. On Linux, the build runs in a manylinux or musllinux container: the
  # stable-ABI wheels use the oldest glibc that is still possible (manylinux2014, glibc 2.17), the
  # free-threaded wheels a newer image, since free-threaded interpreters are much newer anyway.
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, abi3: manylinux2014, free-threaded: 2_28 }
          - { os: ubuntu-24.04-arm, target: aarch64, abi3: manylinux2014, free-threaded: 2_28 }
          - { os: ubuntu-latest, target: x86_64, abi3: musllinux_1_2, free-threaded: musllinux_1_2 }
          - { os: ubuntu-24.04-arm, target: aarch64, abi3: musllinux_1_2, free-threaded: musllinux_1_2 }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-15-intel, target: x86_64 }
          - { os: windows-latest, target: x64 }
          - { os: windows-11-arm, target: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Outside a Linux container, maturin builds for the interpreters of the runner. On Windows,
      # linking against the stable ABI also needs the `python3.lib` of an interpreter.
      - id: free-threaded-older
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.FREE_THREADED_OLDER }}
      - id: free-threaded-newest
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.FREE_THREADED_NEWEST }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Stable-ABI wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.abi3 }}
          args: --release --out dist --manifest-path biodivine-py-sys/Cargo.toml
      - name: Free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.free-threaded }}
          # In a Linux container, the interpreters are found by name, elsewhere by their paths.
          args: >-
            --release --out dist --manifest-path biodivine-py-sys/Cargo.toml
            --interpreter
            ${{ runner.os == 'Linux' && format('python{0}', env.FREE_THREADED_OLDER) || steps.free-threaded-older.outputs.python-path }}
            ${{ runner.os == 'Linux' && format('python{0}', env.FREE_THREADED_NEWEST) || steps.free-threaded-newest.outputs.python-path }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.abi3 || 'native' }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path biodivine-py-sys/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist

  biodivine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: |
          python -m pip install build
          python -m build biodivine --outdir dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-biodivine
          path: dist

  # Installs the release artifacts themselves (not a fresh build) and runs the test suite against
  # them: on every architecture, with the oldest and the newest supported Python version and with
  # the newest free-threaded interpreter, and on Linux also with every version in between (which
  # all use the same stable-ABI wheel) and the older free-threaded one.
  test:
    needs: [wheels, biodivine]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        python-version: ["3.9", "3.15", "3.15t"]
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: ubuntu-latest, python-version: "3.14t" }
          # There is no Python 3.9 for Windows on ARM.
          - { os: windows-11-arm, python-version: "3.15" }
          - { os: windows-11-arm, python-version: "3.15t" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - shell: bash
        run: |
          python -m pip install pytest
          python -m pip install --no-index --only-binary :all: --find-links dist biodivine
      - run: python -m pytest biodivine

  # Runs after the conda upload: a PyPI release cannot be uploaded again, while a conda upload can
  # (see `conda-publish`). If this job fails after a fix, re-running all jobs uploads the fixed
  # conda packages again and retries PyPI. For a pre-release, `conda-publish` is skipped, which must not skip this
  # job: it runs unless a job it needs failed or the workflow was cancelled.
  publish:
    needs: [version, build, sdist, test, conda-publish]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Builds the conda packages (`conda/recipe.yaml`) on every platform; the recipe runs the test
  # suite against them. Conda versions cannot contain a pre-release suffix such as `-rc.1`, so
  # pre-releases are only published to PyPI.
  conda:
    needs: version
    if: ${{ !contains(github.ref_name, '-') }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          rattler-build-version: v0.76.1
          setup-only: true
      - shell: bash
        run: rattler-build build --recipe conda/recipe.yaml -c conda-forge --output-dir conda-dist
      - uses: actions/upload-artifact@v7
        with:
          name: conda-${{ matrix.os }}
          # Every platform builds the `noarch` package of `biodivine` as well (identical files
          # under the same name); only one copy ends up in the merged artifacts below.
          path: conda-dist/*/*.conda

  # Uploads the conda packages once all of them are built and every check of the release has passed
  # (including the tests of the PyPI wheels), right before the PyPI upload, which depends on it.
  # `--force` replaces packages that are already uploaded, so this job can always be re-run.
  conda-publish:
    needs: [version, build, sdist, test, conda]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: conda-*
          merge-multiple: true
          path: conda-dist
      - uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          rattler-build-version: v0.76.1
          setup-only: true
      - env:
          ANACONDA_API_KEY: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          rattler-build upload anaconda --owner "$ANACONDA_OWNER" --channel main --force \
            conda-dist/*/*.conda

  # Builds the API reference and copies it to the documentation server, as `<tag>/` in the
  # directory of this repository. An existing directory of the same tag is replaced. For a stable
  # release (`vX.Y.Z`, without a pre-release suffix), the `latest` symlink next to it is pointed at
  # the new directory; the package metadata and README link to `latest/`.
  docs:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - run: make venv develop docs
      - name: Package
        run: |
          cp -r biodivine/docs/_build "$GITHUB_REF_NAME"
          zip -qr "docs-$GITHUB_REF_NAME.zip" "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: docs-${{ github.ref_name }}.zip
      # Connect to the internal network.
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Deploy
        env:
          TS_HOST: sybila-infra
          DEPLOY_DIR: /root/sybila-infra/stratus/infra/biodivine/docs/biodivine-py
          TAG: ${{ github.ref_name }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new root@"$TS_HOST" true
          scp "docs-$TAG.zip" root@"$TS_HOST:/tmp/docs-biodivine-py-$TAG.zip"
          ssh root@"$TS_HOST" "
              mkdir -p '$DEPLOY_DIR'
              rm -rf '$DEPLOY_DIR/$TAG'
              unzip -q -o /tmp/docs-biodivine-py-$TAG.zip -d '$DEPLOY_DIR'
              rm /tmp/docs-biodivine-py-$TAG.zip"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # A relative link, replaced in one step (`-n`: never follow the old link into a
            # directory, `-f`: replace it).
            ssh root@"$TS_HOST" "ln -sfn '$TAG' '$DEPLOY_DIR/latest'"
          fi

  # Creates a draft GitHub release with generated release notes, the distributions and the
  # documentation. It is published by hand, after the notes are reviewed.
  release:
    needs: [publish, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install llm-release-notes
        run: |
          python -m venv .notes-venv
          .notes-venv/bin/pip install git+https://github.com/daemontus/llm-release-notes.git@v0.1.0
      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          .notes-venv/bin/python -m llm_release_notes.cli --verbose synthesize \
            --repo https://github.com/${{ github.repository }}.git \
            --version "$GITHUB_REF_NAME" \
            --output release-notes.md \
            --config .releasenotes.yml
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: docs
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          body_path: release-notes.md
          files: |
            dist/*
            docs-${{ github.ref_name }}.zip
