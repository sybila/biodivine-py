# Repository-level configuration for PR-Agent (https://docs.pr-agent.ai).
#
# Endpoint, model and credentials are deliberately not configured here: those are
# host-controlled settings supplied through the GitHub Actions variables and secrets that are
# documented in `.github/workflows/pr-review.yml`.

[ignore]
# Generated by Cargo; changes to the dependencies are reviewed in the manifests.
glob = ["Cargo.lock"]

[pr_reviewer]
# AGENTS.md is included as context by default, and remains the source of truth for conventions.
# These instructions only add the review focus that is specific to this repository.
extra_instructions = """
Project-specific review focus:

- Bindings parity: the behaviour of each biodivine submodule comes from a library's `_sys` crate,
  pinned in biodivine-py-sys/Cargo.toml. When a pin changes, check that the Python submodule, its
  tests and its API reference (biodivine/docs/<name>/) follow the changes of the native module.
- Python compatibility: the package supports CPython 3.9 and newer, including free-threaded
  builds. Flag syntax or standard library features newer than 3.9 that are evaluated at runtime,
  and Python-level state that relies on the GIL for thread safety.
- Release consistency: the version in Cargo.toml ([workspace.package]), biodivine/pyproject.toml
  (the version and the exact pin of biodivine-sys) and conda/recipe.yaml change together, and the
  minimum Python version must agree between the `requires-python` fields, the `abi3-py3*` feature
  of biodivine-py-sys and `python_min` of the conda recipe.
- Workflows: the release workflow publishes to PyPI (final, cannot be re-uploaded) after the conda
  upload (repeatable); check that changes keep publishing behind every test, and that
  pull_request_target jobs never check out or run pull request code.
"""
