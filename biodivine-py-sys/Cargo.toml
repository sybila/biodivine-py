[package]
name = "biodivine-py-sys"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "The native extension of the Biodivine Python bindings (the `biodivine-sys` package)."
license.workspace = true
authors.workspace = true
repository.workspace = true
# Distributed as the `biodivine-sys` Python package (built by maturin), never as a crate.
publish = false

[lib]
name = "biodivine_sys"
# `cdylib` for the Python extension module, `rlib` so that the crate's own tests can link it.
crate-type = ["cdylib", "rlib"]

[features]
# Enabled by maturin (see `[tool.maturin] features` in pyproject.toml) when building a wheel: it
# tells PyO3 not to link against libpython, which is what an extension module must do. It must NOT
# be on for `cargo test`, where the crate is linked into a test binary that *does* need libpython.
extension-module = ["pyo3/extension-module"]

[lints]
workspace = true

# One dependency per Biodivine library: the library's `_sys` crate, which lives in the library's own
# repository and is never published. Each one is pinned to a release tag of that repository (a
# commit is fine between releases, but a release of the bindings should pin a released library).
#
# Inside the `biodivine` workspace (where every repository is a submodule next to this one), a
# `path` dependency on the checked-out submodule is used while the two sides change together, e.g.
#
#     biodivine-lib-xml-dom-py-sys = { path = "../../biodivine-lib-xml-dom/biodivine-lib-xml-dom-py-sys" }
[dependencies]
biodivine-lib-xml-dom-py-sys = { git = "https://github.com/sybila/biodivine-lib-xml-dom", tag = "v0.1.0" }
pyo3 = { version = "0.29", features = ["macros"] }

[dev-dependencies]
# `auto-initialize` is what lets `cargo test` start an interpreter in-process.
pyo3 = { version = "0.29", features = ["auto-initialize"] }
