# The Rust side of the Python bindings is a single crate, `biodivine-py-sys`, which builds the
# `biodivine_sys` native extension. The workspace exists so that the lints and the release numbers
# have one home, and so that a future helper crate does not need a second lock file.
[workspace]
members = ["biodivine-py-sys"]
resolver = "3"

[workspace.package]
# The version of both Python distributions: `biodivine-sys` takes it from this manifest (maturin's
# `dynamic = ["version"]`), and `biodivine/pyproject.toml` repeats it, together with an exact pin of
# `biodivine-sys`. `biodivine/tests/test_package.py` checks that the three numbers agree.
version = "0.1.0"
rust-version = "1.95"
license = "MIT"
authors = ["Sybila"]
repository = "https://github.com/sybila/biodivine-py"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
uninlined_format_args = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
checked_conversions = "warn"
iter_over_hash_type = "warn"

# Note: no `panic = "abort"` in any profile. PyO3 converts a Rust panic into a Python
# `PanicException`, which is only possible while unwinding.
